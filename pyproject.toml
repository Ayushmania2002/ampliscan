[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ampliscan"
version = "1.1.0"
description = "Anchor-based amplicon demultiplexer for tetra/octa-nucleotide barcodes"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Ayushman Mallick", email = "ayushmania2002@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Ayushmania2002/ampliscan"
Repository = "https://github.com/Ayushmania2002/ampliscan"
Documentation = "https://github.com/Ayushmania2002/ampliscan#readme"
"Paper" = "https://github.com/Ayushmania2002/ampliscan/blob/main/PAPER.md"
"Zenodo (cite this)" = "https://doi.org/10.5281/zenodo.21505581"
Issues = "https://github.com/Ayushmania2002/ampliscan/issues"

[project.optional-dependencies]
excel = ["pandas>=1.5", "openpyxl>=3.1"]
fast = ["isal>=1.6"]  # 2-5x faster gzip; used automatically when installed
notebook = ["jupyter", "ipywidgets>=8.0", "plotly>=5.0", "pandas>=1.5", "openpyxl>=3.1"]
dev = ["pytest>=7.0"]

[project.scripts]
ampliscan = "ampliscan.cli:main"

[project.gui-scripts]
ampliscan-gui = "ampliscan.gui:launch"

[tool.hatch.build.targets.wheel]
packages = ["src/ampliscan"]
artifacts = ["*.ico", "*.png"]  # bundle brand icons with the installed package

[tool.hatch.build.targets.sdist]
exclude = [
    "/assets",                       # repo-only README banner, not needed to build/install
    "/docs",                         # repo-only diagrams/build docs, not needed to build/install
    "/examples/sample_data",         # demo FASTQ files, not needed to build/install
    "/.github",
]
